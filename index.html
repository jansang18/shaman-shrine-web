<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Fab Shrine Rebuild</title>
	<style>
		:root { color-scheme: dark; font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
		* { box-sizing: border-box; }
		html, body, #canvas { width: 100%; height: 100%; margin: 0; border: 0; padding: 0; }
		body { overflow: hidden; background: #090307; color: #f7ead8; touch-action: none; }
		/* Godot writes pixel sizes inline. Keep those from widening the mobile layout after rotation. */
		#canvas { position: fixed; inset: 0; width: 100% !important; height: 100% !important; max-width: 100vw; max-height: 100dvh; display: block; opacity: 0; transition: opacity .7s ease; }
		#canvas.ready { opacity: 1; }
		#canvas:focus { outline: none; }
		#entry {
			position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
			background:
				radial-gradient(circle at 50% 58%, rgba(178, 70, 28, .22), transparent 38%),
				linear-gradient(180deg, rgba(25, 4, 9, .48), rgba(4, 1, 3, .94)),
				url("index.png") center / cover no-repeat;
		}
		#entry-card { width: min(88vw, 520px); max-height: 94dvh; overflow-y: auto; padding: clamp(18px, 4vw, 38px); text-align: center; border: 1px solid rgba(236, 183, 116, .28); border-radius: 18px; background: rgba(13, 4, 7, .82); box-shadow: 0 24px 80px #000; backdrop-filter: blur(10px); }
		h1 { margin: 0 0 12px; font-size: clamp(28px, 6vw, 48px); font-weight: 500; letter-spacing: .08em; }
		.subtitle { margin: 0 0 28px; color: #cdbba7; line-height: 1.7; }
		button { border: 1px solid #d69b61; border-radius: 999px; padding: 13px 30px; color: #fff5e7; background: #762e1d; font: inherit; font-weight: 700; cursor: pointer; }
		button:focus-visible { background: #974328; outline: 2px solid #f4c187; outline-offset: 3px; }
		@media (hover: hover) { button:hover { background: #974328; } }
		#loading { display: none; margin-top: 24px; }
		#loading-label { margin-bottom: 8px; color: #e2cbb2; }
		progress { width: 100%; height: 8px; accent-color: #c56b3c; }
		#error { display: none; margin-top: 22px; padding: 14px; color: #ffd8d0; background: rgba(120, 18, 18, .42); border-radius: 10px; white-space: pre-line; }
		#retry { display: none; margin-top: 16px; }
		#controls { position: fixed; left: 50%; bottom: 28px; z-index: 5; transform: translateX(-50%); padding: 12px 18px; border: 1px solid rgba(255,255,255,.16); border-radius: 12px; background: rgba(5, 2, 4, .78); color: #ead8c5; opacity: 0; pointer-events: none; transition: opacity .25s; white-space: nowrap; }
		#controls.visible { opacity: 1; }
		#pointer-hint { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 0; z-index: 6; display: none; place-items: center; color: white; background: rgba(0,0,0,.46); font-size: clamp(18px, 3vw, 28px); cursor: pointer; }
		#help { position: fixed; right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); z-index: 8; display: none; width: 48px; height: 48px; padding: 0; }
		#touch-controls { position: fixed; inset: 0; z-index: 5; pointer-events: none; user-select: none; -webkit-user-select: none; }
		#touch-controls[hidden] { display: none; }
		#touch-look { position: absolute; inset: 0 0 0 44%; pointer-events: auto; touch-action: none; }
		#touch-look-label { position: absolute; right: 18px; top: 46%; padding: 8px 12px; background: rgba(5,2,4,.6); border-radius: 20px; color: #ead8c5; font-size: 13px; pointer-events: none; }
		#touch-pad { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 3px; }
		.touch-button { position: relative; padding: 0; min-width: 48px; min-height: 48px; pointer-events: auto; touch-action: none; color: #fff1dc; background: rgba(29,16,15,.76); border: 1px solid rgba(243,206,159,.65); box-shadow: 0 2px 12px #0007; font-size: 22px; -webkit-tap-highlight-color: transparent; }
		.touch-button.held { background: #974328; border-color: #ffe0b0; transform: scale(.95); }
		[data-move="forward"] { grid-area: 1 / 2; }
		[data-move="left"] { grid-area: 2 / 1; }
		[data-move="right"] { grid-area: 2 / 3; }
		[data-move="back"] { grid-area: 3 / 2; }
		#touch-jump { position: absolute; right: max(24px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom)); width: 72px; height: 72px; font-size: 16px; }
		body.touch-mode #controls { top: max(18px, env(safe-area-inset-top)); bottom: auto; max-width: calc(100vw - 148px); white-space: normal; text-align: center; font-size: 13px; }
		@media (max-height: 450px) { #entry-card { padding: 18px 24px; } h1 { font-size: 28px; } .subtitle { margin-bottom: 12px; } }
		@media (prefers-reduced-motion: reduce) { #canvas, #controls { transition: none; } .touch-button.held { transform: none; } }
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">이 브라우저는 canvas를 지원하지 않습니다.</canvas>
	<noscript>JavaScript를 활성화해야 신당 공간에 입장할 수 있습니다.</noscript>
	<section id="entry" aria-labelledby="title">
		<div id="entry-card">
			<h1 id="title">신당</h1>
			<p class="subtitle">설치 없이 공간을 천천히 둘러보세요.<br>휴대폰은 터치로, PC는 키보드와 마우스로 조작합니다.</p>
			<button id="enter" type="button">입장하기</button>
			<div id="loading" aria-live="polite">
				<div id="loading-label">로딩 준비 중…</div>
				<progress id="loading-progress"></progress>
			</div>
			<div id="error" role="alert"></div>
			<button id="retry" type="button">다시 시도</button>
		</div>
	</section>
	<div id="controls">WASD·방향키 이동 · 마우스 시점 · Space 점프 · Shift 달리기 · Esc 마우스 해제</div>
	<button id="pointer-hint" type="button">화면을 클릭해 계속</button>
	<div id="touch-controls" hidden aria-label="터치 조작">
		<div id="touch-look" aria-label="화면을 밀어 시점 회전"></div>
		<span id="touch-look-label">오른쪽 화면을 밀어 둘러보기</span>
		<div id="touch-pad" role="group" aria-label="이동 방향">
			<button class="touch-button" data-move="forward" type="button" aria-label="앞으로 이동">↑</button>
			<button class="touch-button" data-move="left" type="button" aria-label="왼쪽으로 이동">←</button>
			<button class="touch-button" data-move="right" type="button" aria-label="오른쪽으로 이동">→</button>
			<button class="touch-button" data-move="back" type="button" aria-label="뒤로 이동">↓</button>
		</div>
		<button id="touch-jump" class="touch-button" type="button">점프</button>
	</div>
	<button id="help" type="button" aria-label="조작법 보기">?</button>
	<script src="index.js"></script>
	<script>
		const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":82522740,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
		const GODOT_THREADS_ENABLED = false;
		const engine = new Engine(GODOT_CONFIG);
		const canvas = document.getElementById('canvas');
		const entry = document.getElementById('entry');
		const enter = document.getElementById('enter');
		const loading = document.getElementById('loading');
		const loadingLabel = document.getElementById('loading-label');
		const loadingProgress = document.getElementById('loading-progress');
		const errorPanel = document.getElementById('error');
		const retry = document.getElementById('retry');
		const controls = document.getElementById('controls');
		const pointerHint = document.getElementById('pointer-hint');
		const help = document.getElementById('help');
		const touchControls = document.getElementById('touch-controls');
		const touchLook = document.getElementById('touch-look');
		const touchJump = document.getElementById('touch-jump');
		const heldDirections = new Map();
		let lookPointer = null;
		let lastLook = null;
		let controlsTimer;
		let touchMode = (navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches) || typeof canvas.requestPointerLock !== 'function';
		window.shrineTouchMode = touchMode;
		let running = false;

		function sendInput(kind, x = 0, y = 0) {
			if (typeof window.shrineInput === 'function') window.shrineInput(kind, x, y);
		}

		function resetTouchInput() {
			heldDirections.clear();
			lookPointer = null;
			lastLook = null;
			document.querySelectorAll('.touch-button').forEach(button => button.classList.remove('held'));
			sendInput('reset');
		}

		function useTouchControls() {
			touchMode = true;
			window.shrineTouchMode = true;
			document.body.classList.add('touch-mode');
			touchControls.hidden = !running;
			controls.textContent = '왼쪽 방향 버튼: 이동 · 오른쪽 드래그: 시점 · 점프 버튼';
			pointerHint.style.display = 'none';
			sendInput('mode', 1);
			if (document.pointerLockElement) document.exitPointerLock();
		}

		function updateMovement() {
			const values = [...heldDirections.values()];
			const x = Number(values.includes('right')) - Number(values.includes('left'));
			const y = Number(values.includes('back')) - Number(values.includes('forward'));
			sendInput('move', x, y);
		}

		for (const button of document.querySelectorAll('[data-move]')) {
			button.addEventListener('pointerdown', event => {
				event.preventDefault();
				button.setPointerCapture(event.pointerId);
				heldDirections.set(event.pointerId, button.dataset.move);
				button.classList.add('held');
				updateMovement();
			});
			for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
				button.addEventListener(type, event => {
					heldDirections.delete(event.pointerId);
					if (![...heldDirections.values()].includes(button.dataset.move)) button.classList.remove('held');
					updateMovement();
				});
			}
		}
		touchLook.addEventListener('pointerdown', event => {
			if (lookPointer !== null) return;
			event.preventDefault();
			lookPointer = event.pointerId;
			lastLook = { x: event.clientX, y: event.clientY };
			touchLook.setPointerCapture(event.pointerId);
		});
		touchLook.addEventListener('pointermove', event => {
			if (event.pointerId !== lookPointer || !lastLook) return;
			event.preventDefault();
			const scale = 1280 / Math.max(320, window.innerWidth);
			sendInput('look', (event.clientX - lastLook.x) * scale, (event.clientY - lastLook.y) * scale);
			lastLook = { x: event.clientX, y: event.clientY };
		});
		for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
			touchLook.addEventListener(type, event => {
				if (event.pointerId === lookPointer) { lookPointer = null; lastLook = null; }
			});
		}
		touchJump.addEventListener('pointerdown', event => {
			event.preventDefault();
			touchJump.setPointerCapture(event.pointerId);
			touchJump.classList.add('held');
			sendInput('jump');
		});
		for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
			touchJump.addEventListener(type, () => touchJump.classList.remove('held'));
		}
		window.addEventListener('blur', resetTouchInput);
		window.addEventListener('pagehide', resetTouchInput);
		window.addEventListener('resize', resetTouchInput);
		document.addEventListener('visibilitychange', () => { if (document.hidden) resetTouchInput(); });
		document.addEventListener('contextmenu', event => { if (touchMode) event.preventDefault(); });
		// A touchscreen on a hybrid PC may be used after desktop detection.
		document.addEventListener('pointerdown', event => {
			if (event.pointerType === 'touch' && running && !touchMode) useTouchControls();
		}, { capture: true });

		function showFailure(error) {
			console.error(error);
			loading.style.display = 'none';
			errorPanel.style.display = 'block';
			errorPanel.textContent = error instanceof Error ? error.message : String(error || '알 수 없는 오류가 발생했습니다.');
			retry.style.display = 'inline-block';
		}

		function showControls() {
			window.clearTimeout(controlsTimer);
			controls.classList.add('visible');
			controlsTimer = window.setTimeout(() => controls.classList.remove('visible'), 6000);
		}

		async function startExperience() {
			enter.disabled = true;
			enter.style.display = 'none';
			loading.style.display = 'block';
			errorPanel.style.display = 'none';
			const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
			if (missing.length) {
				showFailure('WebGL 2.0을 사용할 수 없습니다. 최신 Chrome, Edge 또는 Firefox로 다시 접속해주세요.\n' + missing.join('\n'));
				return;
			}
			try {
				await engine.startGame({
					onProgress(current, total) {
						if (current > 0 && total > 0) {
							const percent = Math.min(100, Math.round(current / total * 100));
							loadingProgress.value = current;
							loadingProgress.max = total;
							loadingLabel.textContent = `로딩 ${percent}%`;
						} else {
							loadingProgress.removeAttribute('value');
							loadingLabel.textContent = '로딩 중…';
						}
					},
				});
				running = true;
				entry.remove();
				canvas.classList.add('ready');
				help.style.display = 'block';
				if (touchMode) useTouchControls();
				else pointerHint.style.display = 'grid';
				canvas.focus();
				showControls();
			} catch (error) {
				showFailure(error);
			}
		}

		enter.addEventListener('click', startExperience);
		retry.addEventListener('click', () => window.location.reload());
		help.addEventListener('click', showControls);
		pointerHint.addEventListener('click', async () => {
			if (touchMode) { useTouchControls(); return; }
			pointerHint.style.display = 'none';
			canvas.focus();
			try {
				await canvas.requestPointerLock();
			} catch (error) {
				useTouchControls();
				showControls();
			}
		});
		document.addEventListener('pointerlockerror', () => {
			if (running) { useTouchControls(); showControls(); }
		});
		document.addEventListener('pointerlockchange', () => {
			if (!running) return;
			pointerHint.style.display = touchMode || document.pointerLockElement ? 'none' : 'grid';
		});
	</script>
</body>
</html>
